<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Percentage Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h1 class="text-center mb-4">Percentage Calculator</h1>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">X Number:</label>
                    <input type="number" name="x" step="any" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Percentage (Y):</label>
                    <div class="input-group">
                        <input type="number" name="y" step="any" class="form-control" required>
                        <span class="input-group-text">%</span>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Increase/Decrease Rate (Z):</label>
                    <div class="input-group">
                        <input type="number" name="z" step="any" class="form-control" required>
                        <span class="input-group-text">%</span>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Leverage (optional):</label>
                    <div class="input-group">
                        <input type="number" name="leverage" step="any" class="form-control">
                        <span class="input-group-text">x</span>
                    </div>
                    <div class="form-text">Leave empty for 1x leverage.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Operation:</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="operation" id="increase" value="increase" required>
                        <label class="form-check-label" for="increase">Increase</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="operation" id="decrease" value="decrease">
                        <label class="form-check-label" for="decrease">Decrease</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Calculate</button>
            </form>

            {% if result is not none %}
                <div class="alert mt-4" style="color: {{ result_color }}; font-size: 24px; font-weight: bold;">
                    Result: {{ result }}
                </div>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
